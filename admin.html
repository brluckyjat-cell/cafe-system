<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Admin Panel</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f9; margin: 0; }
    .box { max-width: 320px; margin: 40px auto; display: flex; flex-direction: column; gap: 12px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input, button { padding: 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 5px; }
    button { background: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:active { background: #219150; }
    .order { background: white; border-left: 5px solid #27ae60; padding: 15px; margin-bottom: 12px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- Login Section -->
  <div id="login-box" class="box">
    <h3 style="margin:0 0 10px 0; text-align: center;">Cafe Admin Login</h3>
    <input type="email" id="email" placeholder="Email (admin1@cafe1.com)">
    <input type="password" id="password" placeholder="Password">
    <button id="login-btn">Login</button>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboard" style="display:none; max-width: 600px; margin: auto;">
    <div class="header-bar">
      <h2 id="title" style="margin:0;">Live Orders</h2>
      <button id="logout-btn" style="background:#e74c3c; padding:8px 12px; font-size:13px;">Logout</button>
    </div>
    <div id="orders">Waiting for orders...</div>
  </div>

  <script type="module">
    import { db, auth } from './firebase-config.js';
    import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Notification Sound
    const orderSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    // Login Handle
    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;

      try {
        await signInWithEmailAndPassword(auth, email, pass);
        const cafeId = email.includes('admin1') ? 'cafe1' : 'cafe2';

        // Pre-load audio permission for mobile browser
        orderSound.play().then(() => { orderSound.pause(); orderSound.currentTime = 0; }).catch(() => {});

        document.getElementById('login-box').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('title').innerText = cafeId.toUpperCase() + " - Live Orders";

        startLiveOrders(cafeId);
      } catch (e) {
        alert("Login Failed: " + e.message);
      }
    });

    // Logout Handle
    document.getElementById('logout-btn').addEventListener('click', () => {
      signOut(auth).then(() => {
        location.reload();
      });
    });

    // Realtime Order Listener
    function startLiveOrders(cafeId) {
      const q = query(collection(db, "cafes", cafeId, "orders"), orderBy("timestamp", "desc"));
      let isInitialLoad = true;

      onSnapshot(q, (snapshot) => {
        if (!isInitialLoad) {
          snapshot.docChanges().forEach(change => {
            if (change.type === "added") {
              orderSound.play().catch(e => console.log("Audio block: ", e));
            }
          });
        }
        isInitialLoad = false;

        const list = document.getElementById('orders');
        list.innerHTML = "";

        if (snapshot.empty) {
          list.innerHTML = "<p>Abhi tak koi order nahi aaya hai.</p>";
          return;
        }

        snapshot.forEach(doc => {
          const o = doc.data();
          const time = o.timestamp ? new Date(o.timestamp.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
          
          list.innerHTML += `
            <div class="order">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0;">Table No: ${o.table}</h3>
                <span style="font-size:12px; color:#888;">${time}</span>
              </div>
              <p style="margin:8px 0 0 0;">Item: <b>${o.item}</b> | Price: ₹${o.price}</p>
              <p style="margin:4px 0 0 0; color:#e67e22; font-size:14px;">Status: <b>${o.status}</b></p>
            </div>
          `;
        });
      });
    }
  </script>
</body>
</html>
